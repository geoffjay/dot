name = "zsh"
description = "zsh shell: rc, env, profile, fragments (zshrc.d), utils and plugins"
os = ["macos", "linux"]

[defaults]
hist-size = 1000
bat-theme = "ansi"
gcloud-root = "/Users/geoff/Projects/contrib/google-cloud-sdk"
docker-bin = "/Users/geoff/.docker/bin"
java-home = "/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home"

[files]
"zshrc.tmpl" = "~/.zshrc"
"zprofile.tmpl" = "~/.zprofile"
"zshenv.tmpl" = "~/.zshenv"
"zshenv.d-00-keep.tmpl" = "~/.zshenv.d/00-keep"
"util-path.tmpl" = "~/.zsh/util/path"
"util-plugins.tmpl" = "~/.zsh/util/plugins"
"util-docker.tmpl" = "~/.zsh/util/docker"
"util-kitty.tmpl" = "~/.zsh/util/kitty"
"util-llm-gateway.tmpl" = "~/.zsh/util/llm-gateway"
"util-config.tmpl" = "~/.zsh/util/config"
"util-clio.tmpl" = "~/.zsh/util/clio"
"plugins-256color.tmpl" = "~/.zsh/plugins/256color.zsh"
"plugins-pitchfork.tmpl" = "~/.zsh/plugins/pitchfork.zsh"
"zshrc.d-10-alias.tmpl" = "~/.zshrc.d/10-alias"
"zshrc.d-10-color.tmpl" = "~/.zshrc.d/10-color"
"zshrc.d-10-prompt.tmpl" = "~/.zshrc.d/10-prompt"
"zshrc.d-20-devenv.tmpl" = "~/.zshrc.d/20-devenv"
"zshrc.d-20-direnv.tmpl" = "~/.zshrc.d/20-direnv"
"zshrc.d-20-fzf.tmpl" = "~/.zshrc.d/20-fzf"
"zshrc.d-20-java.tmpl" = "~/.zshrc.d/20-java"
